<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>If— Poem | 50 MCQs Test</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #edf3ff;
    margin: 0;
    padding: 15px;
    color: #202b3c;
}

.container {
    max-width: 850px;
    margin: auto;
    background: white;
    padding: 22px;
    border-radius: 14px;
    box-shadow: 0 4px 15px #00000018;
}

h1 {
    color: #173b73;
    text-align: center;
}

.subtitle {
    text-align: center;
    line-height: 1.6;
}

input[type="text"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #aaa;
    border-radius: 7px;
    margin: 10px 0 20px;
    font-size: 16px;
}

.question {
    border: 1px solid #d9e2f1;
    padding: 15px;
    border-radius: 10px;
    margin: 18px 0;
}

.question h3 {
    font-size: 17px;
    line-height: 1.5;
}

.option {
    display: block;
    padding: 11px;
    margin: 8px 0;
    background: #f3f6fc;
    border-radius: 7px;
    cursor: pointer;
    line-height: 1.5;
}

.option:hover {
    background: #e1eaff;
}

.option input {
    margin-right: 8px;
}

.option.correct {
    background: #d6f5dc;
    border: 1px solid #269746;
}

.option.incorrect {
    background: #ffe0e0;
    border: 1px solid #dc4545;
}

.feedback {
    font-weight: bold;
    margin-top: 10px;
    line-height: 1.6;
}

button {
    border: none;
    padding: 13px 20px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    margin: 6px 3px;
}

.submit {
    background: #173b73;
    color: white;
    width: 100%;
}

.reset {
    background: #e2e8f0;
    color: #172033;
}

#result {
    display: none;
    margin-top: 25px;
    padding: 20px;
    background: #e8f5e9;
    border-radius: 10px;
    text-align: center;
    line-height: 1.8;
}

.small {
    color: #526174;
    font-size: 14px;
}

@media(max-width:500px) {
    .container {
        padding: 13px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>English Literature Test</h1>

<h2 style="text-align:center;">Poem: If—</h2>

<p class="subtitle">
<strong>Poet:</strong> Rudyard Kipling<br>
<strong>Total Questions:</strong> 50<br>
<strong>Total Marks:</strong> 50
</p>

<label for="studentName"><strong>Student Name:</strong></label>
<input type="text" id="studentName" placeholder="Enter your name">

<p class="small">
Select one answer for each question. Your score will be shown at the end.
</p>

<div id="quiz"></div>

<button class="submit" id="submitBtn" onclick="submitTest()">
Submit Test
</button>

<button class="reset" onclick="resetTest()">
Restart Test
</button>

<div id="result"></div>

</div>

<script>
const questions = [

{
q:"Who wrote the poem “If—”?",
o:["John Keats","Rudyard Kipling","William Wordsworth","Robert Frost"],
a:1,
e:"Rudyard Kipling is the poet of “If—”."
},

{
q:"What is the main theme of the poem?",
o:["Romantic love","Natural beauty","Self-control and maturity","Political conflict"],
a:2,
e:"The poem teaches self-control, patience, courage and maturity."
},

{
q:"The poem is mainly presented as advice from:",
o:["A father to his son","A king to his soldiers","A teacher to a class","A friend to a stranger"],
a:0,
e:"The poem is structured as advice from a father to his son."
},

{
q:"Which literary form best describes “If—”?",
o:["A short story","A drama","A novel","A didactic poem"],
a:3,
e:"It is a didactic poem because it teaches moral lessons."
},

{
q:"What does the poem encourage us to do during difficult situations?",
o:["Lose hope","Remain calm","Blame others","Avoid responsibility"],
a:1,
e:"The poem emphasizes calmness and self-control."
},

{
q:"Which quality is especially important in the poem?",
o:["Jealousy","Pride","Patience","Revenge"],
a:2,
e:"Patience helps a person face difficulties wisely."
},

{
q:"What should a person do when others doubt them?",
o:["Maintain self-confidence","Stop working","Become angry","Give up immediately"],
a:0,
e:"The poem encourages confidence while remaining open to others' opinions."
},

{
q:"In the poem, triumph and disaster represent:",
o:["Two countries","Two types of friends","Two seasons","Success and failure"],
a:3,
e:"Triumph represents success, while disaster represents failure or misfortune."
},

{
q:"Which device is created by repeating the same consonant sound at the beginning of nearby words?",
o:["Metaphor","Alliteration","Simile","Irony"],
a:1,
e:"Alliteration is the repetition of initial consonant sounds."
},

{
q:"A comparison using “like” or “as” is called:",
o:["Personification","Metaphor","Simile","Hyperbole"],
a:2,
e:"A simile compares two things using words such as like or as."
},

{
q:"A direct comparison without using “like” or “as” is called:",
o:["Metaphor","Simile","Alliteration","Onomatopoeia"],
a:0,
e:"A metaphor describes one thing as another to suggest a similarity."
},

{
q:"Giving human qualities to a non-human thing is:",
o:["Rhyme","Simile","Alliteration","Personification"],
a:3,
e:"Personification gives human qualities or actions to non-human things."
},

{
q:"The repetition of similar ending sounds is known as:",
o:["Imagery","Rhyme","Metaphor","Irony"],
a:1,
e:"Rhyme occurs when words have similar ending sounds."
},

{
q:"Language that appeals to the senses is called:",
o:["Hyperbole","Alliteration","Imagery","Paradox"],
a:2,
e:"Imagery creates sensory impressions involving sight, sound, touch, taste or smell."
},

{
q:"An exaggeration for emphasis is called:",
o:["Hyperbole","Simile","Symbolism","Rhyme"],
a:0,
e:"Hyperbole is deliberate exaggeration for emphasis."
},

{
q:"The repetition of a word or phrase for emphasis is called:",
o:["Metaphor","Irony","Imagery","Repetition"],
a:3,
e:"Repetition emphasizes an idea or creates rhythm."
},

{
q:"What is the dominant tone of the poem?",
o:["Hopeless and bitter","Advisory and encouraging","Comic and playful","Angry and threatening"],
a:1,
e:"The speaker gives serious advice in an encouraging, instructive tone."
},

{
q:"Which quality helps a person continue after failure?",
o:["Carelessness","Arrogance","Perseverance","Jealousy"],
a:2,
e:"Perseverance means continuing despite difficulties."
},

{
q:"What does the poem suggest about success?",
o:["Do not let success make you arrogant","Success makes everyone perfect","Success is more important than honesty","Success should be avoided"],
a:0,
e:"The poem advises readers to remain balanced and humble in success."
},

{
q:"What does the poem suggest about failure?",
o:["Failure must always be hidden","Failure makes life meaningless","Failure should be blamed on others","Face failure without losing courage"],
a:3,
e:"The poem teaches resilience when facing failure."
},

{
q:"What is the purpose of the repeated conditional word in the title?",
o:["To tell a historical story","To introduce conditions for mature conduct","To describe a landscape","To identify a character"],
a:1,
e:"The title introduces conditions associated with developing good character."
},

{
q:"Which word best describes the poem's message about self-control?",
o:["Recklessness","Selfishness","Discipline","Fear"],
a:2,
e:"Discipline and self-control are central ideas in the poem."
},

{
q:"What does keeping one's head suggest?",
o:["Remaining calm under pressure","Being physically tall","Winning every argument","Avoiding all people"],
a:0,
e:"It means staying calm and thinking clearly in difficult situations."
},

{
q:"The poem encourages readers to treat people with:",
o:["Contempt","Fear","Dishonesty","Balance and fairness"],
a:3,
e:"The poem emphasizes balanced judgment and responsible conduct."
},

{
q:"What does the advice about trusting oneself suggest?",
o:["Never listen to anyone","Have confidence while understanding human doubt","Always prove others wrong","Ignore every warning"],
a:1,
e:"The poem values confidence without making a person careless or arrogant."
},

{
q:"Which of these is a literary device?",
o:["Paragraph","Page number","Metaphor","Chapter heading"],
a:2,
e:"Metaphor is a literary device used to create meaning through comparison."
},

{
q:"A poem's rhyme scheme is the pattern of:",
o:["End-rhyming sounds","Characters","Paragraph lengths","Punctuation marks"],
a:0,
e:"A rhyme scheme identifies the pattern of rhymes at the ends of lines."
},

{
q:"What is the rhyme scheme of a stanza?",
o:["The number of characters in it","The number of words in its title","Its main moral only","The pattern of end rhymes in its lines"],
a:3,
e:"A rhyme scheme shows how the end sounds of lines correspond."
},

{
q:"Which feature contributes to the rhythm of a poem?",
o:["The author's address","The pattern of stressed and unstressed syllables","The book's cover","The page colour"],
a:1,
e:"Meter and patterns of stress help create poetic rhythm."
},

{
q:"The speaker's attitude toward the listener is best described as:",
o:["Mocking","Indifferent","Guiding","Hostile"],
a:2,
e:"The speaker offers guidance about how to live responsibly."
},

{
q:"What does the poem value more than showing off?",
o:["Quiet strength and integrity","Fame at any cost","Wealth alone","Popularity alone"],
a:0,
e:"The poem values character and integrity over empty display."
},

{
q:"Which quality is the opposite of patience?",
o:["Calmness","Endurance","Self-control","Impatience"],
a:3,
e:"Impatience means having difficulty waiting calmly."
},

{
q:"What does integrity mean?",
o:["Being famous","Being honest and having strong moral principles","Being wealthy","Being physically strong"],
a:1,
e:"Integrity means honesty and adherence to moral principles."
},

{
q:"What is the central purpose of a didactic poem?",
o:["To tell jokes only","To describe scenery only","To teach a lesson","To list historical dates"],
a:2,
e:"A didactic poem aims to teach or communicate a moral lesson."
},

{
q:"Which device uses a deliberate contradiction that reveals a truth?",
o:["Paradox","Simile","Alliteration","Rhyme"],
a:0,
e:"A paradox appears contradictory but can express a meaningful truth."
},

{
q:"What is symbolism in literature?",
o:["Using only rhyming words","Repeating consonants","Using a question mark","Using something to represent a deeper idea"],
a:3,
e:"Symbolism uses an object, action or image to represent a broader meaning."
},

{
q:"Which statement best expresses the poem's view of courage?",
o:["Courage means never feeling fear","Courage helps people face challenges responsibly","Courage means hurting others","Courage means ignoring every risk"],
a:1,
e:"The poem encourages courage and responsible action in adversity."
},

{
q:"What should guide a person's use of time?",
o:["Carelessness","Wasting opportunities","Purposeful and productive action","Avoiding every responsibility"],
a:2,
e:"The poem emphasizes using time meaningfully and productively."
},

{
q:"What is the speaker mainly trying to help the listener become?",
o:["A mature and responsible person","A famous singer","A powerful ruler","A wealthy merchant"],
a:0,
e:"The poem outlines qualities associated with maturity and responsible adulthood."
},

{
q:"Which literary term refers to a question asked for effect rather than an answer?",
o:["Metaphor","Simile","Rhyme","Rhetorical question"],
a:3,
e:"A rhetorical question is asked to make a point rather than obtain an answer."
},

{
q:"Which of these is an example of a simile?",
o:["Time is a thief","Her courage was like a shield","The wind whispered","Bright birds bravely battled"],
a:1,
e:"The word like makes the comparison a simile."
},

{
q:"Which of these is an example of a metaphor?",
o:["He runs like the wind","The stars shone brightly","Time is a thief","The bell rang loudly"],
a:2,
e:"Time is described as a thief without using like or as."
},

{
q:"Which of these is an example of personification?",
o:["The wind whispered through the trees","The sky was blue","The box was heavy","The room was large"],
a:0,
e:"Whispering is a human action given to the wind."
},

{
q:"Which phrase demonstrates alliteration?",
o:["A quiet night","A golden sun","A calm sea","Brave boys battled"],
a:3,
e:"The repeated initial b sound is alliteration."
},

{
q:"Which literary device is most closely connected with sensory description?",
o:["Irony","Imagery","Paradox","Rhyme scheme"],
a:1,
e:"Imagery appeals to the senses."
},

{
q:"What is the best description of the poem's structure?",
o:["A dialogue between two kings","A fairy tale in prose","A series of conditional statements offering advice","A scientific report"],
a:2,
e:"The poem develops advice through a series of conditions."
},

{
q:"Which quality helps someone resist pressure from a crowd?",
o:["Independent judgment","Blind obedience","Panic","Dishonesty"],
a:0,
e:"Independent judgment allows a person to think and act responsibly."
},

{
q:"What does the poem suggest about dreams and ambitions?",
o:["Dreams should replace all action","Only dreams matter","Ambition always leads to failure","Dreams should not control one's judgment"],
a:3,
e:"The poem advises keeping dreams and ambitions in a balanced perspective."
},

{
q:"Which quality is least consistent with the poem's message?",
o:["Patience","Arrogance","Courage","Self-control"],
a:1,
e:"Arrogance conflicts with the poem's advice about humility and balance."
},

{
q:"What is the best overall lesson of “If—”?",
o:["Always seek praise","Never take responsibility","Develop courage, self-control and integrity","Avoid all challenges"],
a:2,
e:"The poem encourages strong character, resilience and responsible adulthood."
}

];

let answered = new Array(questions.length).fill(false);
let submitted = false;

function renderQuiz() {
    const quiz = document.getElementById("quiz");
    quiz.innerHTML = "";

    questions.forEach((item, i) => {
        const box = document.createElement("div");
        box.className = "question";
        box.id = "question-" + i;

        let html = `<h3>${i + 1}. ${item.q}</h3>`;

        item.o.forEach((option, j) => {
            const letter = String.fromCharCode(65 + j);

            html += `
                <label class="option" id="option-${i}-${j}">
                    <input type="radio"
                        name="q${i}"
                        value="${j}"
                        onchange="checkAnswer(${i}, ${j})">
                    <strong>${letter})</strong> ${option}
                </label>
            `;
        });

        html += `<div class="feedback" id="feedback-${i}"></div>`;
        box.innerHTML = html;
        quiz.appendChild(box);
    });
}

function checkAnswer(i, selected) {
    if (submitted || answered[i]) return;

    answered[i] = true;

    const item = questions[i];
    const feedback = document.getElementById("feedback-" + i);

    const inputs = document.querySelectorAll(
        `input[name="q${i}"]`
    );

    inputs.forEach(input => {
        input.disabled = true;
    });

    if (selected === item.a) {
        document.getElementById(
            `option-${i}-${selected}`
        ).classList.add("correct");

        feedback.style.color = "#16803b";
        feedback.innerHTML = "✓ Correct! " + item.e;
    } else {
        document.getElementById(
            `option-${i}-${selected}`
        ).classList.add("incorrect");

        document.getElementById(
            `option-${i}-${item.a}`
        ).classList.add("correct");

        const letter = String.fromCharCode(65 + item.a);

        feedback.style.color = "#bd2424";
        feedback.innerHTML =
            "✗ Wrong. Correct answer: " +
            letter + ") " + item.o[item.a] +
            "<br>" + item.e;
    }
}

function submitTest() {
    if (submitted) return;

    const name = document.getElementById("studentName")
        .value.trim();

    if (!name) {
        alert("Please enter your name first.");
        document.getElementById("studentName").focus();
        return;
    }

    submitted = true;
    let score = 0;
    let unanswered = 0;

    questions.forEach((item, i) => {
        const selected = document.querySelector(
            `input[name="q${i}"]:checked`
        );

        if (selected && Number(selected.value) === item.a) {
            score++;
        }

        if (!selected) {
            unanswered++;

            const inputs = document.querySelectorAll(
                `input[name="q${i}"]`
            );

            inputs.forEach(input => input.disabled = true);

            const correct = document.getElementById(
                `option-${i}-${item.a}`
            );

            correct.classList.add("correct");

            const letter = String.fromCharCode(65 + item.a);

            document.getElementById("feedback-" + i).innerHTML =
                "Not answered. Correct answer: " +
                letter + ") " + item.o[item.a] +
                "<br>" + item.e;
        }
    });

    const percentage = (score / questions.length) * 100;

    let grade;

    if (percentage >= 80) {
        grade = "Excellent!";
    } else if (percentage >= 60) {
        grade = "Good work!";
    } else if (percentage >= 40) {
        grade = "Keep practising!";
    } else {
        grade = "Revise the poem and try again.";
    }

    const result = document.getElementById("result");

    result.style.display = "block";
    result.innerHTML = `
        <h2>Test Result</h2>
        <p><strong>Student:</strong> ${escapeHTML(name)}</p>
        <p><strong>Score:</strong> ${score} / 50</p>
        <p><strong>Percentage:</strong> ${percentage.toFixed(1)}%</p>
        <p><strong>Correct:</strong> ${score}</p>
        <p><strong>Incorrect or unanswered:</strong>
        ${questions.length - score}</p>
        <p><strong>Unanswered:</strong> ${unanswered}</p>
        <h3>${grade}</h3>
        <p>Review the correct answers and explanations above.</p>
    `;

    document.getElementById("submitBtn").disabled = true;
    result.scrollIntoView({behavior: "smooth"});
}

function escapeHTML(text) {
    return text.replace(/[&<>"']/g, function(char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        }[char];
    });
}

function resetTest() {
    if (!confirm("Do you want to restart the test?")) return;

    answered = new Array(questions.length).fill(false);
    submitted = false;

    document.getElementById("result").style.display = "none";
    document.getElementById("submitBtn").disabled = false;
    document.getElementById("studentName").value = "";

    renderQuiz();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

renderQuiz();
</script>

</body>
</html>
